spring.application.name=ms-recetas
spring.datasource.url=jdbc:mysql://localhost:3306/our_sour_recetas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Dirección del microservicio de Catálogo.
# Puede sobrescribirse mediante una variable de entorno.
catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8081}

# Tiempo máximo para establecer conexión con Catálogo (3 segundos).
catalogo.connect-timeout=3s

# Tiempo máximo de espera de respuesta de Catálogo (5 segundos).
catalogo.read-timeout=5s